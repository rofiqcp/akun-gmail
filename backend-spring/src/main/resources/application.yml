spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
    show-sql: false
  h2:
    console:
      enabled: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080

# Google OAuth Configuration
# IMPORTANT: Replace these with your actual Google OAuth credentials
# Get credentials from: https://console.cloud.google.com/apis/credentials
google:
  oauth:
    client-id: 302677452155-lum0ab3cb2jfk4sbcun4uva867b2afca.apps.googleusercontent.com
    client-secret: ${GOOGLE_CLIENT_SECRET:GOCSPX-placeholder}
    redirect-uri: http://localhost:4200/auth/callback
    auth-uri: https://accounts.google.com/o/oauth2/v2/auth
    token-uri: https://oauth2.googleapis.com/token
    scopes:
      - https://www.googleapis.com/auth/gmail.readonly
      - https://www.googleapis.com/auth/userinfo.email
      - https://www.googleapis.com/auth/userinfo.profile

# Application URL
app:
  url: http://localhost:5173

# OpenAI Configuration
# Set OPENAI_API_KEY environment variable with your OpenAI API key
# Get your key from: https://platform.openai.com/api-keys
openai:
  api-key: ${OPENAI_API_KEY:}